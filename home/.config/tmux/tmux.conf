# ── General ───────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:hyperlinks"
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g escape-time 0
set -g set-clipboard on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Allow unknown escape sequences to passthrough
set -g allow-passthrough on

# ── Prefix ────────────────────────────────────────────────
# Ctrl-a prefix (easier reach than default Ctrl-b)
set -g prefix C-b
bind C-b send-prefix

# ── Window management ────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ──────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ────────────────────────────────────
bind -r C-h previous-window
bind -r C-l next-window
bind -r p previous-window
bind -r n next-window

# ── Copy mode (vi-style) ─────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Reload config ────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind e new-window -n "tmux.conf" "vim ~/.config/tmux/tmux.conf"

# ── Visual mark ──────────────────────────────────────────
# Insert a timestamped marker line (only works at a shell prompt)
bind -r m run-shell 'printf "\r\n──────── MARK $(date +%H:%M:%S) ────────\r" > "#{pane_tty}"'

# ── Status bar ───────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=green,fg=black"
set -g status-left "#[bg=green,fg=black,bold] [#S] "
set -g status-right "#[bg=green,fg=black] %H:%M %d-%b-%y "
# Inactive windows: green bg, red bg if activity
setw -g window-status-format "#[bg=#{?window_activity_flag,red,green},fg=#{?window_activity_flag,white,black}] #I:#W "
# Active window: blue background, white text
setw -g window-status-current-format "#[bg=blue,fg=white,bold] #I:#W "
set -g monitor-activity on
setw -g window-status-activity-style "none"
set -g visual-activity off
# Clear the activity flag when switching to a window
set-hook -g after-select-window "set-option -w monitor-activity off ; set-option -w monitor-activity on"
set -g message-style "bg=green,fg=black"

# ── Pane backgrounds ─────────────────────────────────────
# Inactive panes: light grey background
setw -g window-style "bg=colour236"
# Active pane: black background
setw -g window-active-style "bg=black"

# ── Plugins (TPM) ──────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 minutes, auto-restore on start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Clean up linked sessions on detach (prevents stale main-1, main-2, etc.)
set-hook -g client-detached "run-shell 'for s in $(tmux ls -F \"#{session_name} #{session_grouped} #{session_attached}\" 2>/dev/null | awk \"\\$2==1 && \\$3==0 {print \\$1}\"); do tmux kill-session -t \\$s 2>/dev/null; done'"

run '~/.tmux/plugins/tpm/tpm'
